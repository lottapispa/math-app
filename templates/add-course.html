<!DOCTYPE html>
<html>

<head>
  <title>Front Page</title>
  <link rel="stylesheet" href="/static/main.css"/>
</head>

<body>
  <header>
    <h1>Math App</h1>
  </header>

  <nav>
    <a href="/frontpage">Front Page</a>
    <a href="/">Log In</a>
    <a href="/logout">Log Out</a>
  </nav>

  <h2>Create new course:  { course.name } </h2>

    <form action="/add_course" method="POST">
      Add a lesson: <br />
      <p>
        Lesson name: <br />
        <input type="text" name="lessonname" maxlength="100" required>
      </p>
      <p>
        Write learning material: <br />
        <textarea name="content" rows="5" cols="50" maxlength="1000"></textarea>
      </p>
      <p>
        Add a file (consider what file types are accepted): <br />
        <input type="file" accept=".txt" name="myfile">
      </p>
      <input type="hidden" name="course_id" value="{{ course.id }}">
      <input type="hidden" name="course_name" value="{{ course.name }}">
      <input type="submit" value="Save lesson">
    </form>
    <form action="/add_test" method="POST">
      Add a test: <br />
      <p>
        Test name: <br />
        <input type="text" name="testname" maxlength="100" required>
      </p>
      <input type="hidden" name="course_id" value="{{ course.id }}">
      <input type="hidden" name="course_name" value="{{ course.name }}">
      <input type="submit" value="Save test">
    </form>
    <a href="/frontpage">Done</a>
</body>

</html>
